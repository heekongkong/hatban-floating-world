<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>햇반 플로팅 월드</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--red:#c71d22;--ink:#3b2a20;--cream:#fff8ec}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#bfe8ff;font-family:'Jua',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--ink)}
canvas{display:block;width:100%;height:100%}
.hud{position:fixed;top:12px;display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:5}
#hudL{left:12px;align-items:flex-start}
#hudR{right:12px;align-items:flex-end}
.pill{background:rgba(255,248,236,.9);border:2px solid #fff;border-radius:999px;padding:5px 14px;font-size:17px;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.dm{display:inline-block;width:15px;height:15px;border-radius:50%;background:radial-gradient(circle,#fff6b8 0 32%,#ffd93d 34%);border:2.5px solid #f0b400;vertical-align:-3px;margin-right:2px}
.logoimg{display:block;width:104px;height:104px;margin:0 auto 4px;filter:drop-shadow(0 5px 0 rgba(0,0,0,.18))}
#nick{margin-top:6px;border:2px solid #e8dcc4;border-radius:999px;padding:9px 16px;font-size:16px;font-family:inherit;text-align:center;width:70%;outline:none;background:#fff;color:var(--ink)}
#nick:focus{border-color:var(--red)}
.btns{display:flex;gap:6px;pointer-events:auto}
.btns button{width:40px;height:40px;border-radius:50%;border:2px solid #fff;background:rgba(255,248,236,.9);font-size:18px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.12);font-family:inherit}
#toast{position:fixed;left:50%;top:18%;transform:translate(-50%,-10px);background:var(--red);color:#fff;padding:8px 22px;border-radius:999px;font-size:22px;opacity:0;transition:.3s;pointer-events:none;z-index:6;box-shadow:0 4px 0 rgba(0,0,0,.18);white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(120,90,160,.35);backdrop-filter:blur(4px);z-index:10;padding:16px}
.ov.hidden{display:none}
.card{background:var(--cream);border-radius:28px;padding:26px 28px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.14);border:4px solid #fff}
.logo{display:inline-block;background:var(--red);color:#fff;border-radius:50%;width:84px;height:84px;line-height:84px;font-size:34px;margin-bottom:6px;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.card h1{margin:4px 0 4px;font-size:30px;font-weight:400}
.card p{margin:6px 0;font-size:16px;line-height:1.5}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;text-align:left;margin:12px auto;font-size:15px;background:#fff;border-radius:16px;padding:10px 16px}
.keys b{font-weight:400;color:var(--red)}
.go{margin-top:10px;background:var(--red);color:#fff;border:0;border-radius:999px;padding:12px 38px;font-size:22px;font-family:inherit;cursor:pointer;box-shadow:0 5px 0 #8f1519}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #8f1519}
#joy{position:fixed;left:22px;bottom:26px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.35);border:3px solid rgba(255,255,255,.8);display:none;z-index:5}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(199,29,34,.85);box-shadow:0 3px 0 rgba(0,0,0,.2)}
#jumpBtn{position:fixed;right:26px;bottom:34px;width:92px;height:92px;border-radius:50%;border:4px solid #fff;background:rgba(199,29,34,.9);color:#fff;font-size:20px;font-family:inherit;display:none;z-index:5;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.lb{margin:10px 0 2px;background:#fff;border-radius:16px;padding:8px 12px;text-align:left}
.lbh{text-align:center;font-size:18px;color:var(--red);margin-bottom:4px}
.lbm{text-align:center;font-size:14px;color:#8a7a68;padding:6px 0}
.lbr{display:grid;grid-template-columns:34px 1fr auto;gap:6px;align-items:center;font-size:15px;padding:3px 6px;border-radius:10px}
.lbr .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbr.me{background:#ffe9b8}
.lbr.gap{grid-template-columns:1fr;text-align:center;color:#8a7a68;font-size:13px;padding:0}
#clear .card{max-height:calc(100vh - 32px);overflow-y:auto}
@media (pointer:coarse){#joy,#jumpBtn{display:block}}
#hint{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);font-size:14px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);pointer-events:none;z-index:4;white-space:nowrap}
@media (pointer:coarse){#hint{display:none}}
</style>
</head>
<body>
<div id="hudL" class="hud">
  <div class="pill" id="hHeight">⛰ 0m</div>
  <div class="pill" id="hStage">🍚 0 / 29</div>
  <div class="pill" id="hCoin"><span class="dm"></span> 0 / 0</div>
</div>
<div id="hudR" class="hud">
  <div class="pill" id="hTime">⏱ 0:00.0</div>
  <div class="pill" id="hOnline" style="display:none"></div>
  <div class="btns"><button id="bMute" title="소리 (M)">🔊</button><button id="bResp" title="체크포인트로 (R)">↺</button></div>
</div>
<div id="toast"></div>
<div id="hint">WASD / 방향키 이동 · Space 점프 · 드래그로 시점 · R 체크포인트로</div>

<div id="start" class="ov">
  <div class="card">
    <img class="logoimg" id="logoStart" alt="햇반">
    <h1>햇반 플로팅 월드</h1>
    <p>하늘에 둥둥 떠 있는 거대한 햇반 용기를<br>폴짝폴짝 밟고 꼭대기까지 올라가요!<br>쫀득·퐁신한 밥을 밟는 ASMR 🎧</p>
    <div class="keys">
      <b>이동</b><span>WASD / 방향키 (모바일: 조이스틱)</span>
      <b>점프</b><span>Space (착지 순간 한 번 더 누르면 더 높이!)</span>
      <b>시점</b><span>마우스 드래그 / 화면 드래그</span>
      <b>흑미 햇반</b><span>보라색 밥은 트램펄린이에요</span>
    </div>
    <div><input id="nick" maxlength="8" placeholder="닉네임 (친구들에게 보여요)" autocomplete="off"></div>
    <button class="go" id="goBtn">시작하기</button>
  </div>
</div>

<div id="clear" class="ov hidden">
  <div class="card">
    <img class="logoimg" id="logoClear" alt="햇반">
    <h1>꼭대기 도착! 🎉</h1>
    <p id="clearInfo"></p>
    <div id="lb" class="lb" style="display:none"></div>
    <button class="go" id="againBtn">다시 하기</button>
  </div>
</div>

<div id="joy"><div id="knob"></div></div>
<button id="jumpBtn">점프</button>

/* ================= 상수 ================= */
var GRAV=32, JUMP=13.5, SPEED=9, PR=0.45, PH=2.6;
var N=30;                                   // 햇반 개수(시작 + 골 포함)
var MOVING=[2,7,12,17,23];                  // 좌우로 움직이는 햇반
var TRAMP=[4,10,19,25];                     // 흑미 트램펄린 햇반
var CHECK=[9,16,22,27];                     // 체크포인트

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function approach(v,t,d){return v<t?Math.min(t,v+d):Math.max(t,v-d)}

/* ================= 레이아웃 생성 ================= */
function genLayout(){
  var rnd=mulberry(20251109), L=[];
  L.push({i:0,x:0,y:0,z:0,R:8,H:2.6+0.35*8,type:'start',th:0.4});
  var theta=0.4;
  for(var i=1;i<N;i++){
    var prev=L[i-1], last=(i===N-1);
    var R=last?10.5:5.0-1.9*(i/N)+(rnd()-.5)*0.8;
    var H=2.6+0.35*R;
    var dy=last?2:1.2+rnd()*0.9;
    var t=(JUMP+Math.sqrt(JUMP*JUMP-2*GRAV*dy))/GRAV;
    var budget=0.62*SPEED*t;
    var isMoving=MOVING.indexOf(i)>=0;
    var nm=isMoving?3.5:0;
    var newY=prev.y+dy, ok=false, x=0,z=0,th=0;
    for(var tries=0;tries<50&&!ok;tries++){
      th=theta+0.45+(rnd()-.5)*0.9+(tries>12?(rnd()-.5)*2.2:0);
      if(prev.type==='moving') th=prev.th;
      var gap=1.2+rnd()*(budget-1.2);
      var D=gap+prev.R+0.4+R+0.4;
      x=prev.x+Math.cos(th)*D; z=prev.z+Math.sin(th)*D;
      ok=L.every(function(b){
        if(b===prev) return true;
        var m=nm+(b.type==='moving'?3.5:0);
        var sepV=Math.abs(b.y-newY)>Math.max(b.H,H)+1.5;
        return sepV||Math.hypot(b.x-x,b.z-z)>b.R+R+2+m;
      });
    }
    theta=th;
    var type=last?'goal':isMoving?'moving':TRAMP.indexOf(i)>=0?'tramp':'normal';
    L.push({i:i,x:x,y:newY,z:z,R:R,H:H,type:type,th:th,check:CHECK.indexOf(i)>=0});
  }
  return L;
}
var LAYOUT=genLayout();

function riceTexture(){
  var c=document.createElement('canvas'); c.width=c.height=512;
  var g=c.getContext('2d');
  g.fillStyle='#f4f1e4'; g.fillRect(0,0,512,512);
  var r=mulberry(7);
  for(var k=0;k<330;k++){
    var x=r()*512,y=r()*512,a=r()*Math.PI,w=34+r()*10,h=17+r()*6;
    for(var ox=-512;ox<=512;ox+=512){for(var oy=-512;oy<=512;oy+=512){
      var px=x+ox,py=y+oy; if(px<-60||px>572||py<-60||py>572) continue;
      g.save(); g.translate(px,py); g.rotate(a);
      var gr=g.createRadialGradient(-w*0.15,-h*0.2,1,0,0,w*0.6);
      gr.addColorStop(0,'#ffffff'); gr.addColorStop(0.65,'#fbf9f0'); gr.addColorStop(1,'#d9d3bd');
      g.fillStyle=gr; g.strokeStyle='rgba(170,160,130,.22)'; g.lineWidth=1.2;

      g.restore();

  var t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.encoding=THREE.sRGBEncoding; t.anisotropy=4;

}

function riceBase(Rin,x,z){
  var rr=(x*x+z*z)/(Rin*Rin);
  return -0.05+0.34*Math.pow(Math.max(0,1-rr),0.7)+0.035*Math.sin(x*1.9+z*0.6)*Math.cos(z*2.3-x*0.8);
}
var K_SPR=95, C_SPR=5.5;
function dentHeight(b,lx,lz){
  var h=0;
  for(var k=0;k<b.dents.length;k++){
    var d=b.dents[k], dx=lx-d.x, dz=lz-d.z, r2=dx*dx+dz*dz, s2=d.s*d.s;
    var g=Math.exp(-r2/(2*s2));
    var rip=Math.cos(Math.sqrt(r2)*1.8)*Math.exp(-r2/(2*s2*4.8));
    h+=d.a*(g+0.3*rip);
  }
  return h;
}
function riceHeight(b,lx,lz){return riceBase(b.Rin,lx,lz)+(b.dents.length?dentHeight(b,lx,lz):0);}

var AC=null, master=null, bgmGain=null, noiseBuf=null, muted=false;
function initAudio(){
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=0.85; master.connect(AC.destination);
    bgmGain=AC.createGain(); bgmGain.gain.value=0.5; bgmGain.connect(master);
    var len=AC.sampleRate; noiseBuf=AC.createBuffer(1,len,AC.sampleRate);
    var d=noiseBuf.getChannelData(0); for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
    if(AC.state==='suspended') AC.resume();
    startBGM();
  }catch(e){AC=null}
}
function env(g,t,a,peak,dur){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak),t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);}
function squish(k,pitch){
  if(!AC||muted) return; k=clamp(k,0.15,1); pitch=pitch||1;
  var t=AC.currentTime;
  // 촉촉한 슬랩
  var n=AC.createBufferSource(); n.buffer=noiseBuf; n.playbackRate.value=0.6+Math.random()*0.5;
  var bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=3+Math.random()*5;
  bp.frequency.setValueAtTime(950*pitch,t); bp.frequency.exponentialRampToValueAtTime(240*pitch,t+0.16);
  var g=AC.createGain(); env(g,t,0.012,0.55*k,0.22);
  n.connect(bp); bp.connect(g); g.connect(master); n.start(t,Math.random()*0.5,0.3);
  // 푹신 (저음)
  var o=AC.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(170*pitch,t); o.frequency.exponentialRampToValueAtTime(52,t+0.14);
  var g2=AC.createGain(); env(g2,t,0.008,0.7*k,0.2);
  o.connect(g2); g2.connect(master); o.start(t); o.stop(t+0.25);
  // 쫀득 (공명 스쿼엘치)
  var o2=AC.createOscillator(); o2.type='sawtooth';
  o2.frequency.setValueAtTime(110*pitch,t); o2.frequency.exponentialRampToValueAtTime(60*pitch,t+0.18);
  var lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.Q.value=9;
  lp.frequency.setValueAtTime(1400,t); lp.frequency.exponentialRampToValueAtTime(220,t+0.18);
  var g3=AC.createGain(); env(g3,t+0.01,0.02,0.18*k,0.2);
  o2.connect(lp); lp.connect(g3); g3.connect(master); o2.start(t); o2.stop(t+0.28);
  // 뽀득 (짧은 삑)
  if(Math.random()<0.55){
    var o3=AC.createOscillator(); o3.type='sine';
    var f0=(900+Math.random()*500)*pitch;
    o3.frequency.setValueAtTime(f0,t+0.03); o3.frequency.exponentialRampToValueAtTime(f0*1.55,t+0.1);
    var g4=AC.createGain(); env(g4,t+0.03,0.01,0.09*k,0.1);
    o3.connect(g4); g4.connect(master); o3.start(t+0.03); o3.stop(t+0.16);
  }
}
function tone(f0,f1,dur,vol,type,delay){
  if(!AC||muted) return; var t=AC.currentTime+(delay||0);
  var o=AC.createOscillator(); o.type=type||'sine';
  o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  var g=AC.createGain(); env(g,t,0.01,vol,dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.05);
}

function addDent(b,lx,lz,vel,sigma){
  if(b.dents.length>=8) b.dents.shift();
  b.dents.push({x:lx,z:lz,a:0,v:vel,s:sigma}); b.dirty=true;
}
function groundAt(b,wx,wz){
  var lx=wx-b.x, lz=wz-b.z, d=Math.hypot(lx,lz);
  if(d>b.R+0.7) return null;
  if(d<=b.Rin) return {y:b.y+riceHeight(b,lx,lz),rice:true};
  return {y:b.y,rice:false};
}
function updatePlatforms(time,dt){
  for(var i=0;i<bowls.length;i++){
    var b=bowls[i];
    if(b.type==='moving'){
      var off=3.5*Math.sin(time*0.9+b.phase), tx=-Math.sin(b.th), tz=Math.cos(b.th);
      var nx=b.x0+tx*off, nz=b.z0+tz*off;
      b.dx=nx-b.x; b.dz=nz-b.z; b.x=nx; b.z=nz; b.group.position.set(b.x,b.y,b.z);
    }
    // 밥 스프링
    if(b.dents.length){
      for(var k=b.dents.length-1;k>=0;k--){
        var d=b.dents[k];
        d.v+=(-K_SPR*d.a-C_SPR*d.v)*dt; d.a+=d.v*dt;
        if(Math.abs(d.a)<0.0015&&Math.abs(d.v)<0.02) b.dents.splice(k,1);
      }
      b.dirty=true;
    }
  }
}
function refreshRice(){
  for(var i=0;i<bowls.length;i++){
    var b=bowls[i]; if(!b.dirty) continue;
    var pos=b.geo.attributes.position.array, xs=b.xs, zs=b.zs;
    for(var v=0;v<xs.length;v++) pos[v*3+1]=riceHeight(b,xs[v],zs[v]);
    b.geo.attributes.position.needsUpdate=true; b.geo.computeVertexNormals();

function onLand(b,g,impact){

  p.sqV+=clamp(impact*0.045,0,0.9);

}

function step(dt){
  var prevY=p.y;
  // 입력 방향 (카메라 기준)
  var fx=(keys['w']||keys['arrowup']?1:0)-(keys['s']||keys['arrowdown']?1:0)-joy.y;
  var rx=(keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0)+joy.x;
  var il=Math.hypot(fx,rx); if(il>1){fx/=il;rx/=il;}
  var sn=Math.sin(yaw), cs=Math.cos(yaw);
  var wx=(-sn)*fx+cs*rx, wz=(-cs)*fx+(-sn)*rx;
  if(!state.started||state.cleared){wx=wz=0;}
  var tvx=wx*SPEED, tvz=wz*SPEED, has=(wx!==0||wz!==0);
  var acc=(p.grounded?70:30)*dt, dec=(p.grounded?55:5)*dt;
  if(has){p.vx=approach(p.vx,tvx,acc);p.vz=approach(p.vz,tvz,acc);}
  else{p.vx=approach(p.vx,0,dec);p.vz=approach(p.vz,0,dec);}

  // 움직이는 발판 태우기
  if(p.grounded&&p.platform){p.x+=p.platform.dx;p.z+=p.platform.dz;}

  // 점프
  if(jumpBuf>0) jumpBuf-=dt;
  if(p.coyote>0) p.coyote-=dt;
  if(jumpBuf>0&&(p.grounded||p.coyote>0)&&state.started&&!state.cleared){
    var boost=1, pf=p.platform;
    if(pf&&pf.type==='tramp') boost=1.5;
    p.vy=JUMP*boost; p.grounded=false; p.coyote=0; jumpBuf=0; p.airT=0;
    sndJump(boost>1);
    if(pf&&pf.dents&&pf.Rin){ addDent(pf,p.x-pf.x,p.z-pf.z,-6,1.2); squish(0.45,1.15); }
    p.platform=null;
  }
  // 중력
  if(!p.grounded){
    var gmul=(p.vy>0&&!jumpHeld)?1.9:1;
    p.vy-=GRAV*gmul*dt; p.airT+=dt;
  }

  // 수평 이동 + 용기 옆면 충돌
  p.x+=p.vx*dt; p.z+=p.vz*dt;
  for(var i=0;i<bowls.length;i++){
    var b=bowls[i], top=b.y, yb=top-b.H;
    if(p.y<top-0.3&&p.y+PH>yb){
      var dx=p.x-b.x, dz=p.z-b.z, d=Math.hypot(dx,dz)||1e-4;
      var yy=Math.min(p.y+PH,top), r;
      if(yy>top-0.5) r=b.R+0.68; else r=b.R*0.6+b.R*0.4*(yy-yb)/(b.H-0.5)+0.1;
      if(d<r+PR){
        var nxn=dx/d, nzn=dz/d, tgt=(yy>top-0.5)?r:(r+PR);
        p.x=b.x+nxn*tgt; p.z=b.z+nzn*tgt;
        var vin=p.vx*nxn+p.vz*nzn; if(vin<0){p.vx-=vin*nxn;p.vz-=vin*nzn;}
      }
    }
  }

  // 수직 이동
  var wasGrounded=p.grounded;
  if(!p.grounded){
    p.y+=p.vy*dt;
    // 머리 부딪힘
    if(p.vy>0){
      for(var j=0;j<bowls.length;j++){
        var c=bowls[j], yb2=c.y-c.H;
        if(prevY+PH<=yb2+0.05&&p.y+PH>yb2&&Math.hypot(p.x-c.x,p.z-c.z)<c.R*0.6+0.2){p.y=yb2-PH;p.vy=0;}
      }
    }
  }

  // 지면 판정
  var best=null, bb=null;
  for(var m=0;m<bowls.length;m++){
    var bw=bowls[m], g=groundAt(bw,p.x,p.z);
    if(g&&prevY>=g.y-0.5&&(!best||g.y>best.y)){best=g;bb=bw;}
  }
  if(best&&p.vy<=0&&p.y<=best.y+(p.grounded?0.3:0)){
    var impact=-p.vy, wasAir=!p.grounded&&p.airT>0.08;
    p.y=best.y; p.platform=bb;
    if(!p.grounded){
      p.grounded=true; p.vy=0;
      if(wasAir){
        onLand(bb,best,impact);
        if(bb.type==='tramp'&&best.rice){ p.vy=Math.max(JUMP*(jumpBuf>0?1.55:1.15),impact*0.85); p.grounded=false; p.airT=0; p.platform=null; jumpBuf=0; sndJump(true); }
        else if(jumpBuf>0){ p.vy=JUMP*1.22; p.grounded=false; p.airT=0; p.platform=null; jumpBuf=0; sndJump(true); }
        else if(impact>9&&best.rice){ p.vy=impact*0.3; p.grounded=false; p.airT=0; p.platform=null; }
      }
    }
    if(p.grounded){
      // 발걸음
      var sp=Math.hypot(p.vx,p.vz);
      if(sp>2){
        p.stepT-=dt;
        if(p.stepT<=0){
          p.stepT=0.3-Math.min(0.1,sp*0.008);
          if(best.rice){ addDent(bb,p.x-bb.x,p.z-bb.z,-3.2,0.9); squish(0.3,0.9+Math.random()*0.4); }
          else sndClick();
        }
      } else p.stepT=0;
    }
  }else if(p.grounded){
    p.grounded=false; p.coyote=0.12; p.platform=null; p.airT=0;
  }

  // 코인
  for(var q=0;q<coins.length;q++){
    var co=coins[q]; if(co.got) continue;
    var cxw=co.bowl.x+co.lx, czw=co.bowl.z+co.lz, cyw=co.bowl.y+1.7;
    var cdx=p.x-cxw, cdz=p.z-czw, cdy=(p.y+1.2)-cyw;
    if(cdx*cdx+cdz*cdz+cdy*cdy<2.4*2.4){co.got=true;co.holder.visible=false;state.coins++;setCoinHud(state.coins);sndCoin();}
  }

  // 낙하 → 리스폰
  if(p.y<bowls[state.cp].y-26){ sndFall(); respawn(false); }

  // 골 판정
  if(state.started&&!state.cleared&&p.grounded&&p.platform&&p.platform.type==='goal'){
    state.goalStay+=dt; if(state.goalStay>0.5) finish();
  } else state.goalStay=0;

  // 스쿼시 스프링
  p.sqV+=(-90*p.sq-9*p.sqV)*dt; p.sq+=p.sqV*dt;
}

var CONF=300, cfPos=new Float32Array(CONF*3), cfVel=new Float32Array(CONF*3), cfCol=new Float32Array(CONF*3);

  try{
    var r=net.sb.from('scores').insert({nickname:net.name,time_ms:ms,coins:cn,session_id:net.id});
    if(r&&r.then) r.then(done,done); else done();
  }catch(e){ done(); }
}
function loadBoard(){
  var box=$('lb');
  var fail=function(){ box.innerHTML='<div class="lbh">🏆 TOP 10</div><div class="lbm">순위를 불러오지 못했어요</div>'; };
  try{
    net.sb.from('scores').select('nickname,time_ms').order('time_ms',{ascending:true}).limit(200).then(function(res){
      if(!res||res.error||!res.data){ fail(); return; }
      var seen={}, list=[];
      res.data.forEach(function(r){ var k=String(r.nickname).toLowerCase(); if(!seen[k]){seen[k]=1;list.push(r);} });
      var me=String(net.name).toLowerCase(), mi=-1;
      list.forEach(function(r,i){ if(String(r.nickname).toLowerCase()===me) mi=i; });
      box.innerHTML='<div class="lbh">🏆 TOP 10</div>';
      function row(i,r,isMe){
        var d=document.createElement('div'); d.className='lbr'+(isMe?' me':'');
        var a=document.createElement('span'); a.textContent=(i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'위');
        var b=document.createElement('span'); b.className='n'; b.textContent=r.nickname;
        var c=document.createElement('span'); c.textContent=fmt(r.time_ms/1000);
        d.appendChild(a); d.appendChild(b); d.appendChild(c); box.appendChild(d);
      }
      list.slice(0,10).forEach(function(r,i){ row(i,r,i===mi); });
      if(mi>=10){
        var g=document.createElement('div'); g.className='lbr gap'; g.textContent='⋯'; box.appendChild(g);
        row(mi,list[mi],true);
      } else if(mi<0){
        var m=document.createElement('div'); m.className='lbm'; m.textContent='내 기록은 아직 순위권 밖이에요'; box.appendChild(m);
      }
      if(!list.length){ box.innerHTML='<div class="lbh">🏆 TOP 10</div><div class="lbm">아직 기록이 없어요</div>'; }
    },fail);
  }catch(e){ fail(); }
}
var net={on:false,ch:null,id:Math.random().toString(36).slice(2,8),name:'',ci:Math.floor(Math.random()*JACKETS.length),remotes:{},t:0};
function netInit(){
  var url=CFG.SUPABASE_URL, key=CFG.SUPABASE_ANON_KEY;
  if(!url||!key||!window.supabase||!window.supabase.createClient) return;
  try{
    var sb=window.supabase.createClient(url,key); net.sb=sb;
    net.ch=sb.channel('hatban-floating-world',{config:{broadcast:{self:false,ack:false}}});
    net.ch.on('broadcast',{event:'pos'},function(m){onNet(m.payload);}).subscribe(function(st){ if(st==='SUBSCRIBED'){net.on=true; toast('친구들과 연결됐어요 👥');} });
  }catch(e){ net.on=false; }
}
function onNet(d){
  if(!d||!d.id||d.id===net.id) return;
  var r=net.remotes[d.id];
  if(!r){
    var av=makeAvatar(JACKETS[(d.c|0)%JACKETS.length]); var nm=nameSprite(String(d.n||'친구').slice(0,8)); nm.position.set(0,3.5,0); av.g.add(nm);
    av.g.position.set(d.x,d.y,d.z); scene.add(av.g);
    r=net.remotes[d.id]={av:av,ph:0,face:d.f||0};
  }
  r.tx=d.x; r.ty=d.y; r.tz=d.z; r.tf=d.f||0; r.last=performance.now();
}
function netUpdate(dt){
  var now=performance.now();
  if(net.ch&&net.on){
    net.t-=dt;
    if(net.t<=0){ net.t=0.1;
      try{net.ch.send({type:'broadcast',event:'pos',payload:{id:net.id,n:net.name,c:net.ci,x:+p.x.toFixed(2),y:+p.y.toFixed(2),z:+p.z.toFixed(2),f:+p.face.toFixed(2)}});}catch(e){}
    }
  }
  var cnt=0;
  for(var id in net.remotes){
    var r=net.remotes[id];
    if(now-r.last>4000){ scene.remove(r.av.g); delete net.remotes[id]; continue; }
    cnt++;
    var g=r.av.g, k=Math.min(1,dt*10), ox=g.position.x, oz=g.position.z;
    g.position.x+=(r.tx-ox)*k; g.position.y+=(r.ty-g.position.y)*k; g.position.z+=(r.tz-oz)*k;
    var spd=Math.hypot(g.position.x-ox,g.position.z-oz)/Math.max(dt,0.001);
    r.face=lerpAngle(r.face,r.tf,k); g.rotation.y=r.face;
    if(spd>0.8) r.ph+=dt*Math.min(spd,10)*1.3; else r.ph*=0.9;
    var sw=Math.sin(r.ph)*Math.min(1,spd/6)*0.9;
    r.av.legL.rotation.x=sw; r.av.legR.rotation.x=-sw; r.av.armL.rotation.x=-sw; r.av.armR.rotation.x=sw;
  }
  var ho=$('hOnline'); if(net.on){ho.style.display='';ho.textContent='👥 '+(cnt+1)+'명 접속 중';}
}

/* ================= 공식 로고 (일부 용기에만 디자인 요소로) ================= */
function faceUpright(mesh,normal){
  var up=new THREE.Vector3(0,1,0), right=new THREE.Vector3().crossVectors(up,normal).normalize(), u2=new THREE.Vector3().crossVectors(normal,right);
  mesh.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(right,u2,normal));
}
function buildLogoThings(img){
  var c=document.createElement('canvas'); c.width=c.height=256; c.getContext('2d').drawImage(img,0,0,256,256);
  var tex=new THREE.CanvasTexture(c); tex.encoding=THREE.sRGBEncoding; tex.anisotropy=8;
  var mat=new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide});
  // 1) 용기 옆면 로고: 체크포인트 두 곳(9, 22번)과 골 용기(29번)만
  [9,22,29].forEach(function(i){
    var b=bowls[i], prev=bowls[i-1], phi=Math.atan2(prev.z-b.z,prev.x-b.x);
    var s=i===29?4.6:Math.min(3.0,b.R*0.75);
    var y=Math.min(-b.H*0.3,-0.8-s/2), fr=(y+b.H)/(b.H-0.5), r=b.R*0.6+b.R*0.4*fr, al=Math.atan2(0.4*b.R,b.H-0.5);
    var m=new THREE.Mesh(new THREE.PlaneGeometry(s,s),mat);
    m.position.set(Math.cos(phi)*(r+0.05),y,Math.sin(phi)*(r+0.05));
    faceUpright(m,new THREE.Vector3(Math.cos(phi)*Math.cos(al),-Math.sin(al),Math.sin(phi)*Math.cos(al)).normalize());
    b.group.add(m);
  });
  // 2) 시작 지점 입간판
  var b0=bowls[0], b1=bowls[1], h=Math.atan2(b1.z-b0.z,b1.x-b0.x), a=h+Math.PI/2;
  var cv=document.createElement('canvas'); cv.width=640; cv.height=360; var g=cv.getContext('2d');
  g.fillStyle='#fffaf0'; g.fillRect(0,0,640,360);
  g.drawImage(img,40,70,220,220);
  g.fillStyle='#3b2a20'; g.textAlign='left'; g.textBaseline='middle';
  g.font='bold 64px "Jua",sans-serif'; g.fillText('플로팅 월드',285,150);
  g.font='28px "Jua",sans-serif'; g.fillStyle='#c71d22'; g.fillText('FLOATING WORLD',290,222);
  var st=new THREE.CanvasTexture(cv); st.encoding=THREE.sRGBEncoding; st.anisotropy=8;
  var sign=new THREE.Group();
  var board=new THREE.Mesh(new THREE.BoxGeometry(6.4,3.6,0.16),new THREE.MeshStandardMaterial({color:0xfffaf0,roughness:.6}));
  board.position.y=4.0; sign.add(board);
  var face=new THREE.Mesh(new THREE.PlaneGeometry(6.4,3.6),new THREE.MeshBasicMaterial({map:st}));
  face.position.set(0,4.0,0.09); sign.add(face);
  [-2.7,2.7].forEach(function(x){var po=new THREE.Mesh(new THREE.CylinderGeometry(.14,.14,4.4,8),new THREE.MeshStandardMaterial({color:0xe9e2d4}));po.position.set(x,2.2,-0.05);po.castShadow=true;sign.add(po);});
  sign.position.set(b0.x+Math.cos(a)*7.9,b0.y,b0.z+Math.sin(a)*7.9);
  sign.rotation.y=Math.atan2(-Math.cos(a),-Math.sin(a));
  scene.add(sign);
  // 3) 골 깃발
  var fc=document.createElement('canvas'); fc.width=256; fc.height=160; var fg=fc.getContext('2d');
  fg.fillStyle='#fffaf0'; fg.fillRect(0,0,256,160); fg.drawImage(img,78,6,100,100);
  fg.fillStyle='#3b2a20'; fg.font='bold 34px "Jua",sans-serif'; fg.textAlign='center'; fg.textBaseline='middle'; fg.fillText('GOAL!',128,136);
  var ft=new THREE.CanvasTexture(fc); ft.encoding=THREE.sRGBEncoding;
  var gf=bowls[N-1].flag; if(gf){gf.material.map=ft; gf.material.needsUpdate=true;}
}
var LOGO_IMG=new Image();
LOGO_IMG.onload=function(){try{buildLogoThings(LOGO_IMG);}catch(e){console.error(e);}};
LOGO_IMG.src=LOGO_DATA;

/* ================= 렌더 루프 ================= */
try{var sn0=localStorage.getItem('hatban_nick'); if(sn0) $('nick').value=sn0;}catch(_){}
var last=performance.now(), acc=0, worldT=0, camT=new THREE.Vector3(), hudT=0;
camT.set(p.x,p.y+1.6,p.z);
function lerpAngle(a,b,t){var d=Math.atan2(Math.sin(b-a),Math.cos(b-a));return a+d*t;}

function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  worldT+=dt; acc+=dt;
  if(state.started&&!state.cleared) state.time+=dt;
  var STEP=1/100;
  while(acc>=STEP){updatePlatforms(Date.now()/1000,STEP);step(STEP);acc-=STEP;worldT+=0;}
  refreshRice();

  // 아바타
  avatar.position.set(p.x,p.y,p.z);
  var sp=Math.hypot(p.vx,p.vz);
  if(sp>0.6) p.face=lerpAngle(p.face,Math.atan2(p.vx,p.vz),Math.min(1,dt*14));
  avatar.rotation.y=p.face;
  if(p.grounded&&sp>0.6) p.walkPh+=dt*sp*1.3; else p.walkPh*=0.9;
  var sw=Math.sin(p.walkPh)*Math.min(1,sp/6)*0.9;
  legL.rotation.x=sw; legR.rotation.x=-sw; armL.rotation.x=-sw; armR.rotation.x=sw;
  if(!p.grounded){ var up=p.vy>0; armL.rotation.x=armR.rotation.x=up?-2.6:-1.3; armL.rotation.z=0.25; armR.rotation.z=-0.25; legL.rotation.x=up?0.5:-0.2; legR.rotation.x=up?-0.3:0.4; }
  else {armL.rotation.z=0.05;armR.rotation.z=-0.05;}
  var sq=clamp(p.sq,-0.3,0.45);
  avBody.scale.set(0.65*(1+sq*0.6),0.65*(1-sq),0.65*(1+sq*0.6));

  // 카메라
  if(!state.started){ yaw+=dt*0.12; }
  camT.x+=(p.x-camT.x)*Math.min(1,dt*9); camT.z+=(p.z-camT.z)*Math.min(1,dt*9);
  var ty=p.y+1.7; camT.y+=(ty-camT.y)*Math.min(1,dt*(p.grounded?10:4));
  var cp=Math.cos(pitch), cd=camDist+(state.started?0:3);
  camera.position.set(camT.x+Math.sin(yaw)*cp*cd,camT.y+Math.sin(pitch)*cd,camT.z+Math.cos(yaw)*cp*cd);
  camera.lookAt(camT.x,camT.y,camT.z);

  // 그림자/조명 따라가기
  sun.position.set(p.x+18,p.y+34,p.z+12); sun.target.position.set(p.x,p.y,p.z); sun.target.updateMatrixWorld();

  // 하늘색
  var sk=skyAt(p.y); scene.background.copy(sk); scene.fog.color.copy(sk);

  // 데코레이션, 코인, 깃발
  for(var i=0;i<decor.length;i++){var d=decor[i]; d.rotation.y+=d.userData.spin*dt; if(d.userData.bob!==undefined) d.position.y+=Math.sin(worldT*0.6+d.userData.bob)*0.01;}
  for(var c=0;c<coins.length;c++){var co=coins[c]; if(!co.got){co.holder.rotation.y=worldT*2.2; co.holder.position.y=1.7+Math.sin(worldT*2+c)*0.15;}}
  var gb=bowls[N-1]; if(gb.star){gb.star.rotation.y=worldT*1.5;gb.star.position.y=7.5+Math.sin(worldT*2)*0.2;} if(gb.flag) gb.flag.rotation.y=Math.sin(worldT*2)*0.15;
  for(var f=0;f<bowls.length;f++){var bf=bowls[f]; if(bf.cflag){bf.cflag.rotation.y=Math.sin(worldT*2+f)*0.2; bf.cflag.material.color.setHex(state.cp>=bf.i?0x35c46b:0xbbbbbb);}}
  updateSteam(worldT); updateConfetti(dt); netUpdate(dt);

  // HUD
  hudT-=dt;
  if(hudT<=0){hudT=0.1; $('hHeight').textContent='⛰ '+Math.max(0,Math.floor(p.y))+'m'; $('hTime').textContent='⏱ '+fmt(state.time);}
  renderer.render(scene,camera);
}
window.addEventListener('resize',function(){
  renderer.setSize(window.innerWidth,window.innerHeight);
  camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
});
requestAnimationFrame(frame);

/* 디버그/테스트용 훅 */
window.__hatban={p:p,bowls:bowls,state:state,step:step,layout:LAYOUT,net:net,onNet:onNet,setView:function(y,pt,d){yaw=y;pitch=pt;camDist=d;}};
})();
</script>
